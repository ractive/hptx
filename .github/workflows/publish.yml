name: Publish crates

# Publishes the two protocol crates, kermit-proto and xmodem-proto, to
# crates.io (decision log 2026-10-05 and 2026-10-06: they are the only
# published crates; hptx-core and hptx-cli ship as GitHub release
# binaries, release.yml).
#
# Dry run: a pull request that changes this file, or a dispatch with the
# default input. Real publish: a dispatch from main with dry_run=false.
# cargo orders the two crates itself (xmodem-proto's dev-dependency on
# kermit-proto) and waits for the index between them. A crate whose exact
# version is already on crates.io is skipped, so a run that got only
# kermit-proto out can be dispatched again for xmodem-proto.
#
#   gh workflow run publish.yml                     # dry run
#   gh workflow run publish.yml -f dry_run=false    # publish
#
# Needs the repository secret CARGO_REGISTRY_TOKEN: a crates.io API token
# with the publish-new and publish-update scopes, limited to the crate
# names kermit-proto and xmodem-proto. Once both crates exist on crates.io,
# switch to trusted publishing (rust-lang/crates-io-auth-action) and drop
# the token (kb/backlog/crates-trusted-publishing.md).

on:
  pull_request:
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify only, upload nothing
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    # A dispatch runs only from main: against another ref it would hand the
    # token to whatever that branch's copy of this file does.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Anything but an explicit dispatch with dry_run=false is a dry run.
      - name: Mode
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" && "$DRY_RUN" == "false" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "real publish"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "dry run"
          fi
      # The crates to publish: those whose exact version is not on the
      # index yet (crates.io answers 404 for an unknown version).
      - name: Crates to publish
        id: crates
        run: |
          packages=""
          while read -r name version; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: hptx publish.yml (https://github.com/ractive/hptx)' \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version is already on crates.io, skipped" ;;
              404) echo "$name $version to publish"; packages="$packages -p $name" ;;
              *) echo "::error::crates.io answered $status for $name $version"; exit 1 ;;
            esac
          done < <(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "kermit-proto" or .name == "xmodem-proto") | "\(.name) \(.version)"')
          if [[ -z "$packages" ]]; then
            echo "::error::both crates are already published at this version"
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: Dry run
        if: steps.mode.outputs.publish == 'false'
        run: cargo publish ${{ steps.crates.outputs.packages }} --locked --dry-run
      - name: Publish
        if: steps.mode.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish ${{ steps.crates.outputs.packages }} --locked

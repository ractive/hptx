name: Release

# Dry run (iteration 11a): builds hptx for the four release targets, runs
# the fast tests on each and uploads the binaries as workflow artifacts.
# It creates no GitHub Release, pushes no tag and publishes nothing:
# `contents: read` below would refuse it anyway.
#
# Triggers: a pull request or an iteration-branch push that changes this
# file (workflow_dispatch only works once the workflow is on the default
# branch, so this is how a change to it gets its dry run), by hand with
# `gh workflow run release.yml --ref <branch>` after the merge, and a pushed
# `v*` tag (path filters do not apply to tag pushes).

on:
  push:
    branches: ['iter-*/**']
    tags: ['v*']
    paths: ['.github/workflows/release.yml']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            # Native Intel runner, so the x86_64 tests run on x86_64.
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # The Intel macOS runner is the slow one (about 6 min on a cold cache).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Fast tests
        run: cargo test --locked --workspace -q --target ${{ matrix.target }}
      - name: Build hptx
        run: cargo build --locked --release -p hptx-cli --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/hptx --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hptx-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/hptx
            target/${{ matrix.target }}/release/hptx.exe
          if-no-files-found: error
          retention-days: 7

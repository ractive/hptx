[package]
name = "hptx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kermit-proto = { version = "0.1.1", path = "../kermit-proto" }
xmodem-proto = { version = "0.1.1", path = "../xmodem-proto" }
png = "0.18.1"
serialport = { version = "4.10.1", default-features = false }
thiserror = "2.0.21"
# The saturnus emulator, in-process (`saturnus://[MODEL@]ROM` addresses), and its
# host-side driver for the scripted boot and Kermit server start. Keep both
# at the same rev.
saturnus = { git = "https://github.com/ractive/saturnus", rev = "a6e7e9514821dede1ce8114c6562366c97d8e8ce" }
saturnus-drive = { git = "https://github.com/ractive/saturnus", rev = "a6e7e9514821dede1ce8114c6562366c97d8e8ce" }


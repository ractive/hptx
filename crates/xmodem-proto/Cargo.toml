[package]
name = "xmodem-proto"
description = "Sans-IO XModem sender and receiver (checksum, CRC-16, HP's CRC, 1k blocks) for HP 48 and 49 calculators"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/xmodem-proto"
readme = "README.md"
keywords = ["xmodem", "sans-io", "serial", "file-transfer", "hp49"]
categories = ["network-programming", "hardware-support"]

[dev-dependencies]
# Only for the text trace format (`kermit_proto::trace`) shared by both
# protocol crates' recorded traces and replay tests.
kermit-proto = { path = "../kermit-proto", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The caller's clock on wasm32 (`std::time::Instant::now()` panics on
# wasm32-unknown-unknown); see "Time and WebAssembly" in the crate docs.
web-time = "1.1.0"

[lints]
workspace = true

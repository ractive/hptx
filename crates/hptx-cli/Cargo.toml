[package]
name = "hptx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "hptx: transfer files between HP 48/49 calculators and a computer over serial"

[[bin]]
name = "hptx"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env", "wrap_help"] }
clap_complete = "4.6"
hptx-core = { version = "0.1.0", path = "../hptx-core" }
jaq-core = "3.1.1"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.3"
kermit-proto = { version = "0.1.0", path = "../kermit-proto" }
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serialport = { version = "4.10.1", default-features = false }

[lints]
workspace = true

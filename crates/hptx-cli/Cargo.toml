[package]
name = "hptx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "hptx: transfer files between HP 48/49 calculators and a computer over serial"

[[bin]]
name = "hptx"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env", "wrap_help"] }
clap_complete = "4.6"
hptx-core = { version = "0.1.0", path = "../hptx-core" }
jaq-core = "3.1.1"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.3"
kermit-proto = { version = "0.1.0", path = "../kermit-proto" }
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serialport = { version = "4.10.1", default-features = false }

[lints]
workspace = true

# deb/rpm packaging for the release pipeline (ractive/release-workflows);
# the completions are generated by its pre-package-command.
[package.metadata.deb]
name = "hptx"
maintainer = "ractive"
section = "utils"
priority = "optional"
assets = [
    ["target/release/hptx", "usr/bin/", "755"],
    ["completions/hptx.bash", "usr/share/bash-completion/completions/hptx", "644"],
    ["completions/_hptx", "usr/share/zsh/vendor-completions/_hptx", "644"],
    ["completions/hptx.fish", "usr/share/fish/vendor_completions.d/hptx.fish", "644"],
    ["../../LICENSE", "usr/share/doc/hptx/", "644"],
    ["../../README.md", "usr/share/doc/hptx/", "644"],
]
extended-description = "Transfers files between HP 48/49 calculators and a computer over a serial cable or TCP with Kermit and XModem; a CLI and REPL with JSON output for scripts and AI agents."

[package.metadata.generate-rpm]
name = "hptx"
assets = [
    { source = "target/release/hptx", dest = "/usr/bin/hptx", mode = "755" },
    { source = "completions/hptx.bash", dest = "/usr/share/bash-completion/completions/hptx", mode = "644" },
    { source = "completions/_hptx", dest = "/usr/share/zsh/site-functions/_hptx", mode = "644" },
    { source = "completions/hptx.fish", dest = "/usr/share/fish/vendor_completions.d/hptx.fish", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/doc/hptx/LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/hptx/README.md", mode = "644", doc = true },
]

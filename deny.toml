# Configuration for cargo-deny — https://embarkstudios.github.io/cargo-deny/
#
# Run locally: cargo deny check (also part of `just lint`).
# Runs on every PR and every push to main in ci.yml's `check` job
# (EmbarkStudios/cargo-deny-action, SHA-pinned; iteration 11a). Modelled on
# hyalo's deny.toml.
#
# The graph is checked with every feature on (`all-features` below), so a
# feature added later is audited too, not only the default build.

[graph]
all-features = true

[advisories]
# No ignores. Prefer upgrading a dependency over ignoring an advisory.
ignore = []

[licenses]
# hyalo's allow-list, minus BSD-3-Clause (nothing in the tree uses it; an
# unused allowance only warns), plus BSL-1.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    # Boost 1.0: permissive (no attribution in binaries required).
    # clipboard-win and error-code, Windows-only dependencies of rustyline.
    "BSL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# serialport is MPL-2.0: file-level copyleft. Linking it into the MIT hptx
# binary is fine as long as serialport's own source stays available (it is,
# on crates.io) and modifications to its files would be MPL too; we use it
# unmodified. Scoped to the one crate so no other MPL code slips in silently.
[[licenses.exceptions]]
crate = "serialport"
allow = ["MPL-2.0"]

# Duplicates it warns about (2026-10-05), none fixable here: nix 0.26
# (serialport) vs 0.31 (rustyline), windows-sys 0.52 (serialport) vs 0.61
# (clap, rustyline), bitflags 1 (serialport's nix 0.26) vs 2, and miniz_oxide
# 0.8 (png) vs 0.9 (flate2). They clear when serialport and png move on.
[bans]
multiple-versions = "warn"
# hptx-core's git dependencies on saturnus and saturnus-drive have no
# `version`, which cargo-deny counts as wildcard requirements; nothing else
# is a wildcard.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# hptx-core's in-process saturnus transport, pinned to
# a rev in crates/hptx-core/Cargo.toml.
allow-git = ["https://github.com/ractive/saturnus"]

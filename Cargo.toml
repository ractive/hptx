[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ractive/hptx"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

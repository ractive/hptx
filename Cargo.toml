[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ractive/hptx"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# The in-process emulator (saturnus transport) runs far below real time
# unoptimised; the e2e suite drives it in the test profile.
[profile.dev.package.saturnus]
opt-level = 3

[profile.dev.package.saturnus-drive]
opt-level = 3
